name: tic_tac_go
description: "Tic Tac Go - Offline Strategy 7x7 Game powered by Entire Solution"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  web_socket_channel: ^3.0.3
  provider: ^6.0.5
  http: ^1.1.2
  shared_preferences: ^2.1.1
  flutter_dotenv: ^5.0.2
  intl: ^0.19.0
  dio: ^5.9.0
  google_sign_in: ^6.2.1
  audioplayers: ^5.2.1
  flutter_animate: ^4.5.0
  page_transition: ^2.1.0
  dynamic_color: ^1.7.0
  flutter_svg: ^2.0.10+1
  flutter_screenutil: ^5.9.0
  vibration: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/tic-tac-go-logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0B1220"
  adaptive_icon_foreground: "assets/tic-tac-go-logo.png"

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
    - assets/sound/
    - assets/fonts/
    - assets/tic-tac-go-logo.png
